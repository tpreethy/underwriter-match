[project]
name = "underwriter-match"
version = "0.1.0"
description = "GenAI-powered loan application underwriter assignment"
readme = "README.md"
authors = [
    { name = "Preethi", email = "tpreethy17@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/F = core errors, I = import sorting, B = common bug patterns, UP = modern syntax
select = ["E", "F", "I", "B", "UP","ANN"]

[tool.pyright]
pythonVersion = "3.14"
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers" 
